<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div class="container admin-container">
      <div class="header-top-row">
        <span class="badge">Administrative Panel</span>
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">Dark mode</span>
        </button>
      </div>

      <h1>Student Hub</h1>
      <h2>Admin Overview</h2>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">120</div>
          <div class="stat-label">Total Students</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">5</div>
          <div class="stat-label">Total Courses</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">3</div>
          <div class="stat-label">Total Events</div>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <tr>
            <th>Total Students</th>
            <td>120</td>
          </tr>

          <tr>
            <th>Total Courses</th>
            <td>5</td>
          </tr>

          <tr>
            <th>Total Events</th>
            <td>3</td>
          </tr>
        </table>
      </div>

      <form>
        <label>Add University Notice</label>
        <input type="text" placeholder="Enter notice announcement" required />

        <div class="buttons">
          <input type="submit" value="POST NOTICE" />
          <input type="reset" value="CLEAR" />
        </div>
      </form>

      <a href="../home.html" class="home-btn">← Back to Home</a>

      <hr />

      <footer>
        <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
      </footer>
    </div>

    <script src="../JS/SCRIPT.JS"></script>
  </body>
</html>
