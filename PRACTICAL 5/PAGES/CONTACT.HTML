<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Student Hub</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>

  <body>
    <div class="container contact-container">
      <div class="header-top-row">
        <span class="badge">Support &amp; Contact</span>
        <button type="button" class="theme-toggle-btn" aria-label="Toggle dark/light theme">
          <span class="theme-icon">🌙</span>
          <span class="theme-text">Dark mode</span>
        </button>
      </div>

      <h1>Student Hub</h1>
      <h2>Contact Page</h2>

      <form>
        <label>Name</label>
        <input type="text" placeholder="Enter your name" required />

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required />

        <label>Message</label>
        <textarea rows="5" placeholder="Enter your message" required></textarea>

        <div class="buttons">
          <input type="submit" value="SEND" />
          <input type="reset" value="RESET" />
        </div>
      </form>

      <p class="email">📧 studenthub@charusat.ac.in</p>

      <a href="DASHBOARD.HTML">Dashboard</a>
      <a href="../home.html" class="home-btn">← Back to Home</a>

      <hr />

      <footer>
        <p>&copy; 2026 Student Hub. All Rights Reserved.</p>
      </footer>
    </div>

    <script src="../JS/SCRIPT.JS"></script>
  </body>
</html>
